<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Website</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        audio {
            display: none;
        }
    </style>
</head>

<body>

    <video id="video" autoplay loop playsinline>
        <source src="video.mp4" type="video/mp4">
    </video>

    <audio id="audio" loop>
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    

    <script>
        
        document.addEventListener("click", function() {
            document.getElementById("audio").play();
        }, { once: true });
    </script>

</body>
</html>
